[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "real-community-indexer"
version = "0.1.0"
description = "Typed Python client for the public REAL indexer API"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

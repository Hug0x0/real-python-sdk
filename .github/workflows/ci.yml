name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.10" }
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pytest
      - run: python -m build
